<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accordion A11y Test Bed</title>
  <script type="module" src="/build/aegov.esm.js"></script>
  <script nomodule src="/build/aegov.js"></script>
  <link rel="stylesheet" href="/build/aegov.css">
  <style>body { padding: 40px; font-family: sans-serif; } section { margin-bottom: 60px; }</style>
</head>
<body>
<main>

  <!-- basic 3-item single-open accordion (all closed) -->
  <section>
    <aegov-accordion id="acc-basic">
      <aegov-accordion-item heading="Section 1">
        Content one — <a id="acc-link-in-panel" href="#">link inside panel</a>
      </aegov-accordion-item>
      <aegov-accordion-item heading="Section 2">Content two</aegov-accordion-item>
      <aegov-accordion-item heading="Section 3">Content three</aegov-accordion-item>
    </aegov-accordion>
  </section>

  <!-- accordion with a disabled middle item -->
  <section>
    <aegov-accordion id="acc-disabled">
      <aegov-accordion-item heading="Active item 1">First active content</aegov-accordion-item>
      <aegov-accordion-item heading="Disabled item" is-disabled="true">Disabled content</aegov-accordion-item>
      <aegov-accordion-item heading="Active item 2">Second active content</aegov-accordion-item>
    </aegov-accordion>
  </section>

  <!-- multiple-open accordion -->
  <section>
    <aegov-accordion id="acc-multiple" is-multiple="true">
      <aegov-accordion-item heading="Item A">Content A</aegov-accordion-item>
      <aegov-accordion-item heading="Item B">Content B</aegov-accordion-item>
      <aegov-accordion-item heading="Item C">Content C</aegov-accordion-item>
    </aegov-accordion>
  </section>

  <!-- default-open: first item open on load -->
  <section>
    <aegov-accordion id="acc-default-open" default-open="0">
      <aegov-accordion-item heading="Pre-opened item">Pre-opened content</aegov-accordion-item>
      <aegov-accordion-item heading="Closed item">Closed content</aegov-accordion-item>
    </aegov-accordion>
  </section>

  <!-- custom heading level (h2) -->
  <section>
    <aegov-accordion id="acc-heading-h2" heading-level="2">
      <aegov-accordion-item heading="H2 item 1">Content 1</aegov-accordion-item>
      <aegov-accordion-item heading="H2 item 2">Content 2</aegov-accordion-item>
    </aegov-accordion>
  </section>

  <!-- nested accordion (outer h3, inner should auto-increment to h4) -->
  <section>
    <aegov-accordion id="acc-outer">
      <aegov-accordion-item heading="Outer 1">
        <aegov-accordion id="acc-inner">
          <aegov-accordion-item heading="Inner 1">Inner content 1</aegov-accordion-item>
          <aegov-accordion-item heading="Inner 2">Inner content 2</aegov-accordion-item>
        </aegov-accordion>
      </aegov-accordion-item>
      <aegov-accordion-item heading="Outer 2">Outer content 2</aegov-accordion-item>
    </aegov-accordion>
  </section>

</main>
</body>
</html>
