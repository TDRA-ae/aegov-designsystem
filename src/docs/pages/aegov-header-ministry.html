<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="/build/aegov.esm.js"></script>
  <script nomodule src="/build/aegov.js"></script>
  <link rel="stylesheet" href="/build/aegov.css">
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  </style>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('dir') === 'rtl') {
      document.documentElement.setAttribute('dir', 'rtl');
      document.documentElement.setAttribute('lang', 'ar');
    }
  </script>
</head>
<body>
  <aegov-header skip-content-container="#main" entity-name="Ministry of Energy and Infrastructure" entity-domain="www.moei.gov.ae">
    <img src="https://mof.gov.ae/wp-content/themes/mof-theme/assets/images/mof-logo.svg" alt="Ministry of Energy and Infrastructure Logo" slot="logo">
    <aegov-input slot="search" type="search" placeholder="Search..." size="base">
      <svg slot="icon-start" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    </aegov-input>
  </aegov-header>
  <div class="aegov-container hidden md:flex md:justify-between md:gap-4 xl:gap-8 md:items-center">
    <nav class="py-2">
      <ul class="list-none m-0 p-0 flex justify-start items-center gap-4">
        <li><aegov-link href="#" class="text-sm lg:text-base font-bold">Home</aegov-link></li>
        <li><aegov-link href="#" class="text-sm lg:text-base font-bold">Services</aegov-link></li>
        <li><aegov-link href="#" class="text-sm lg:text-base font-bold">Awareness centre</aegov-link></li>
        <li><aegov-link href="#" class="text-sm lg:text-base font-bold">Digital participation</aegov-link></li>
        <li><aegov-link href="#" class="text-sm lg:text-base font-bold">Open data</aegov-link></li>
        <li><aegov-link href="#" class="text-sm lg:text-base font-bold">Media centre</aegov-link></li>
        <li><aegov-link href="#" class="text-sm lg:text-base font-bold">About</aegov-link></li>
      </ul>
    </nav>
    <div class="flex items-center justify-end gap-4">
      <aegov-button size="sm" variant="link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" fill="none"/><circle cx="128" cy="96" r="64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"/><path d="M32,216c19.37-33.47,54.55-56,96-56s76.63,22.53,96,56" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"/></svg>
      </aegov-button>
    </div>
  </div>
  <main id="main" class="aegov-container">
    <div style="padding-top:50px;">
      <a href="#">I must get focus</a>
    </div>
  </main>
</body>
</html>
