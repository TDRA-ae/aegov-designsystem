<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Test</title>
  <script type="module" src="/build/aegov.esm.js"></script>
  <script nomodule src="/build/aegov.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 100px;
      background: #f0f0f0;
    }
    .demo {
      margin: 50px;
      padding: 50px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="demo">
    <h1>Tooltip Test Page</h1>
    <p>Hover over the button below:</p>

    <aegov-tooltip content="This is a simple tooltip">
      <button style="padding: 10px 20px; font-size: 16px;">Hover Me</button>
    </aegov-tooltip>

    <br><br>

    <p>Click the button below:</p>
    <aegov-tooltip content="Click tooltip" trigger="click">
      <button style="padding: 10px 20px; font-size: 16px;">Click Me</button>
    </aegov-tooltip>
  </div>

  <script>
    // Debug logging
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM loaded');
      const tooltips = document.querySelectorAll('aegov-tooltip');
      console.log('Found tooltips:', tooltips.length);
      tooltips.forEach((tooltip, index) => {
        console.log(`Tooltip ${index}:`, tooltip);
        console.log('  - content:', tooltip.getAttribute('content'));
        console.log('  - trigger:', tooltip.getAttribute('trigger'));
      });
    });
  </script>
</body>
</html>
