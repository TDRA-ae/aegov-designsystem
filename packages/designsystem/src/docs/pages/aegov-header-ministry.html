<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="/build/aegov.esm.js"></script>
  <script nomodule src="/build/aegov.js"></script>
  <link rel="stylesheet" href="/build/aegov.css">
  <link rel="stylesheet" href="/docs/doc-style.css">
  <style>
    body { margin: 0; padding: 0; background: transparent; scrollbar-width: none; }
    body::-webkit-scrollbar { display: none; }
  </style>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('dir') === 'rtl') {
      document.documentElement.setAttribute('dir', 'rtl');
      document.documentElement.setAttribute('lang', 'ar');
    }
  </script>
</head>
<body>
  <aegov-header skip-content-container="#main" entity-name="Ministry of Industry and Advanced Technology" entity-domain="https://moiat.gov.ae">
    <img src="https://moiat.gov.ae/-/media/site/moiat/identity/logo/moiat_logo_eng.ashx?iar=0&hash=42716B005DAA289F20DE7B83B575605A" alt="Ministry of Industry and Advanced Technology logo" slot="logo">
    <aegov-input slot="search" type="search" placeholder="Search the ministry…" size="base">
      <svg slot="icon-start" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    </aegov-input>
  </aegov-header>
  <div class="aegov-container hidden md:block">
    <aegov-navbar label-nav="Main navigation" gap="gap-6">
      <aegov-navbar-item href="#" is-active="true">Home</aegov-navbar-item>
      <aegov-navbar-item href="#">Services</aegov-navbar-item>
      <aegov-navbar-item href="#">Awareness centre</aegov-navbar-item>
      <aegov-navbar-item href="#">Open data</aegov-navbar-item>
      <aegov-navbar-item href="#">Media centre</aegov-navbar-item>
      <aegov-navbar-item href="#">About</aegov-navbar-item>
    </aegov-navbar>
  </div>
  <main id="main" class="aegov-container">
    <div style="padding-top:50px;">
      <a href="#">I must get focus</a>
    </div>
  </main>
</body>
</html>
